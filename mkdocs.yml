site_name: QuantToolbox
site_description: Python port of the MATLAB QuantToolbox — econometrics, portfolio optimization, and risk analytics.
repo_url: https://github.com/lcrmorin/QuantToolBox
repo_name: lcrmorin/QuantToolBox

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            docstring_style: numpy
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Featured examples:
      - Overview: examples/index.md
      - Risk budgeting (ERC / VaR / ES): examples/risk_budgeting.md
      - Black-Litterman: examples/black_litterman.md
      - Mean-variance / MinVar / Tracking error: examples/mean_variance.md
      - Whittle (frequency-domain) estimation: examples/whittle.md
      - Ridge, OLS, robust regression: examples/regression.md
      - SVM classification: examples/svm.md
      - Building blocks (bisection, linalg, numerical diff, proximal): examples/building_blocks.md
      - Translation tracker (all 149 examples): examples/examples_tracking.md
  - API Reference:
      - Overview: api/index.md
      - dates: api/dates.md
      - backtest: api/backtest.md
      - stats: api/stats.md
      - econometrics: api/econometrics.md
      - optim: api/optim.md
      - portfolio: api/portfolio.md
      - mixtures: api/mixtures.md
      - svm: api/svm.md
      - spline: api/spline.md
      - maths: api/maths.md
      - linalg: api/linalg.md
      - viz: api/viz.md
  - Notes for translators:
      - MATLAB bugs found: matlab_bugs_found.md
      - Library alternatives: library_alternatives.md
      - Migration map: migration_map.md
