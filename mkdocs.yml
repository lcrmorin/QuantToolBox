site_name: QuantToolBox
site_description: Python port of the MATLAB QuantToolBox — econometrics, portfolio optimization, and risk analytics.
repo_url: https://github.com/lcrmorin/QuantToolBox
repo_name: lcrmorin/QuantToolBox

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            docstring_style: numpy
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Featured examples:
      - Overview: examples/index.md
      - Price bonds: examples/bond.md
      - Optimize portfolios: examples/mean_variance.md
      - Budget risk: examples/risk_budgeting.md
      - Blend market views: examples/black_litterman.md
      - Combine core tools: examples/building_blocks.md
      - Fit regressions: examples/regression.md
      - Fit spectral models: examples/whittle.md
      - Classify data: examples/svm.md
  - API Reference:
      - Overview: api/index.md
      - backtest: api/backtest.md
      - bond: api/bond.md
      - copula: api/copula.md
      - credit: api/credit.md
      - dates: api/dates.md
      - econometrics: api/econometrics.md
      - linalg: api/linalg.md
      - maths: api/maths.md
      - mixtures: api/mixtures.md
      - optim: api/optim.md
      - portfolio: api/portfolio.md
      - spline: api/spline.md
      - stats: api/stats.md
      - sustainable_finance: api/sustainable_finance.md
      - svm: api/svm.md
      - viz: api/viz.md
  - Notes for translators:
      - Migration map: migration_map.md
      - MATLAB bugs found: matlab_bugs_found.md
      - Library alternatives: library_alternatives.md
