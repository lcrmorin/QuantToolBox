[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quanttoolbox"
version = "0.1.0"
description = "Python port of the MATLAB QuantToolbox: econometrics, portfolio optimization, and risk analytics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Lucas Morin" }
]
keywords = ["quant", "portfolio-optimization", "econometrics", "risk-parity", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "statsmodels>=0.14",
    "qpsolvers>=4.3",
    "cvxpy>=1.4",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
viz = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "black>=24.0",
]

[project.urls]
Repository = "https://github.com/lcrmorin/hfs-archive"

[tool.hatch.build.targets.wheel]
packages = ["src/quanttoolbox"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "NPY"]
ignore = ["N803", "N806", "E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=quanttoolbox --cov-report=term-missing"

[tool.coverage.run]
source = ["src/quanttoolbox"]
