[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quanttoolbox"
version = "0.1.0"
description = "Python port of the MATLAB QuantToolbox: econometrics, portfolio optimization, and risk analytics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Lucas Morin" }
]
keywords = ["quant", "portfolio-optimization", "econometrics", "risk-parity", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "statsmodels>=0.14",
    "qpsolvers>=4.3",
    "cvxpy>=1.4",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
viz = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "black>=24.0",
]

[project.urls]
Repository = "https://github.com/lcrmorin/hfs-archive"

[tool.hatch.build.targets.wheel]
packages = ["src/quanttoolbox"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "NPY"]
# N803/N806: allow MATLAB-style variable names during transition (X, Y, RB, etc.)
# E501: several still-unported module stubs carry a long one-line docstring
# listing every original .m file they'll replace; real code stays under 100
# chars via ruff-format, so this only silences the stub headers, not logic.
ignore = ["N803", "N806", "E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
# numpy's shape-parameterized stubs (tuple[int] vs tuple[int, ...]) and
# scalar/array union return types produce a lot of false-positive noise
# across numpy-heavy modules (assignment/index/arg-type codes) without
# catching real bugs. Real Optional/None-narrowing issues (e.g. union-attr,
# operator misuse) stay enabled.
disable_error_code = ["assignment", "index", "arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=quanttoolbox --cov-report=term-missing"

[tool.coverage.run]
source = ["src/quanttoolbox"]
